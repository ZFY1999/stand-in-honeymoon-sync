<div
    class="stand-in-honeymoon-sync-settings extension_settings"
    data-extension-name="stand-in-honeymoon-sync"
>
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b><i class="fa-solid fa-shirt"></i> 暮蝶做的蜜月换衣间</b>
            <div
                class="inline-drawer-icon fa-solid fa-circle-chevron-down down"
            ></div>
        </div>
        <div class="inline-drawer-content">
            <div class="description_text">
                对话中购买「可购买衣物库」的衣物后，自动追加到「已购衣物库」，并同步到服务器世界书。
            </div>

            <div class="setting_item">
                <span>启用已购衣物同步</span>
                <div class="SillyTavernSwitch">
                    <input
                        id="sihs-enabled-checkbox"
                        type="checkbox"
                    />
                    <div class="SillyTavernSlider"></div>
                </div>
            </div>
            <div class="description_text">
                关闭后不再监听购买场景（已添加的条目不会删除）。
            </div>

            <div
                id="sihs-status-display"
                class="description_text"
                style="margin-top: 8px"
            ></div>

            <div
                style="margin-top: 10px; font-size: 12px; color: #8a8a8a; letter-spacing: 1px"
            >
                ▍日常操作
            </div>
            <div
                class="button-group"
                style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px"
            >
                <button
                    id="sihs-write-server"
                    class="menu_button"
                    style="flex: 1 1 30%; min-width: 108px; margin: 0"
                >
                    <i class="fa-solid fa-cloud-arrow-up"></i> 同步到服务器
                </button>
                <button
                    id="sihs-force-sync"
                    class="menu_button"
                    style="flex: 1 1 30%; min-width: 108px; margin: 0"
                >
                    <i class="fa-solid fa-arrows-rotate"></i> 立即同步
                </button>
                <button
                    id="sihs-export-card"
                    class="menu_button"
                    style="flex: 1 1 30%; min-width: 108px; margin: 0"
                >
                    <i class="fa-solid fa-file-export"></i> 导出角色卡
                </button>
            </div>
            <div class="description_text" style="font-size: 12px; color: #777; margin-top: 4px">
                买完衣物：点「同步已购库到服务器」写入平台世界书；若那一步失败，用「导出角色卡」下载最新卡后重新导入覆盖。
            </div>

            <div
                style="margin-top: 10px; font-size: 12px; color: #8a8a8a; letter-spacing: 1px"
            >
                ▍诊断 / 排查
            </div>
            <details>
                <summary
                    style="cursor: pointer; font-size: 12px; color: #8a8a8a; margin: 4px 0 6px"
                >
                    诊断与测试（故障时才需要）
                </summary>
                <div
                    class="button-group"
                    style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px"
                >
                    <button
                        id="sihs-self-check"
                        class="menu_button"
                        style="flex: 1 1 30%; min-width: 108px; margin: 0"
                    >
                        <i class="fa-solid fa-stethoscope"></i> 运行自检
                    </button>
                    <button
                        id="sihs-write-worldinfo"
                        class="menu_button"
                        style="flex: 1 1 30%; min-width: 108px; margin: 0"
                    >
                        <i class="fa-solid fa-flask"></i> 写 worldInfo
                    </button>
                    <button
                        id="sihs-test-save"
                        class="menu_button"
                        style="flex: 1 1 30%; min-width: 108px; margin: 0"
                    >
                        <i class="fa-solid fa-floppy-disk"></i> 测试保存
                    </button>
                </div>
            </details>

            <pre
                id="sihs-diag-pre"
                class="description_text"
                style="display: none; white-space: pre-wrap; word-break: break-all; font-size: 12px; margin-top: 8px; max-height: 320px; overflow-y: auto;"
            ></pre>

            <div
                class="description_text"
                style="text-align: center; margin-top: 8px; color: #999; font-size: 12px"
            >
                版本 <span id="sihs-version"></span> · 由暮蝶维护 ·
                <a
                    id="sihs-open-github"
                    href="javascript:void(0)"
                    style="color: #4c8dff; text-decoration: none"
                >源码</a>
            </div>
        </div>
    </div>
</div>
